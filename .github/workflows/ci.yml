name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run functional tests
        run: python -m pytest tests -q
      - name: Compile sources
        run: python -m py_compile wafstat tests/test_public_wafstat_scanner.py scripts/validate_examples.py
      - name: Validate schema examples
        run: python scripts/validate_examples.py
      - name: Check patch whitespace
        run: git diff --check
